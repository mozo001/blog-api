{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Blog{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <nav class="navbar">
        <div class="brand">Samia Blog</div>
        <div class="nav-links">
            <a href="{% url 'blog_list' %}">Home</a>
            <a href="{% url 'blog_create' %}">+ Create Blog</a>
        </div>
    </nav>

    <main>
        {% block content %}
            <h1>All Blogs</h1>

            {% if blogs %}
                {% for blog in blogs %}
                    <article class="blog-item">
                        <h2>
                            <a href="{% url 'blog_detail' blog.pk %}">{{ blog.title }}</a>
                        </h2>
                        <p>{{ blog.description }}</p>
                    </article>
                {% endfor %}
            {% else %}
                <p>No blogs available yet. <a href="{% url 'blog_create' %}">Create the first one!</a></p>
            {% endif %}
        {% endblock %}
    </main>

</body>
</html>
